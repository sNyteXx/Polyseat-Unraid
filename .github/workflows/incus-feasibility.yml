name: WIP Incus real build (isolated, no deployment)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/incus-feasibility.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout pinned Incus release
        run: |
          git clone --depth 1 --branch v6.0.0 https://github.com/lxc/incus.git incus
          cd incus
          git rev-parse HEAD | tee ../incus-source-commit.txt
      - name: Install build dependencies in ephemeral runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsqlite3-dev libacl1-dev libcap-dev libseccomp-dev libudev-dev libuv1-dev liblz4-dev libzstd-dev libbtrfs-dev libdevmapper-dev liblxc-dev libapparmor-dev protobuf-compiler
      - name: Build incus binaries
        run: |
          cd incus
          make -j2
      - name: Package artifacts with checksums
        run: |
          mkdir -p dist
          find incus/bin -maxdepth 1 -type f -exec cp {} dist/ \;
          test -n "$(find dist -type f -print -quit)"
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: incus-build-WIP-NOT-UNRAID-VALIDATED
          path: |
            dist/
            incus-source-commit.txt
          retention-days: 7

name: Unraid WIP preflight checks

on:
  push:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
  pull_request:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: POSIX shell syntax
        run: |
          for script in unraid/scripts/*.sh unraid/scripts/lib/*.sh unraid/tests/*.sh; do
            case "$script" in unraid/scripts/ci-canary-cgroup.sh|unraid/scripts/ci-e2e-canary.sh|unraid/scripts/ci-e2e-desktop-canary.sh|unraid/scripts/local-hook-rehearsal.sh|unraid/scripts/local-hook-rehearsal-inner.sh) continue ;; esac
            sh -n "$script"
          done
          bash -n unraid/scripts/ci-canary-cgroup.sh
          bash -n unraid/scripts/ci-e2e-canary.sh
          bash -n unraid/scripts/ci-e2e-desktop-canary.sh
          bash -n unraid/scripts/local-hook-rehearsal.sh unraid/scripts/local-hook-rehearsal-inner.sh
          sh -n unraid/seat-image/build-seat-image.sh
          sh -n unraid/seat-image/provision.sh
          bash -n unraid/seat-image/rootfs/usr/local/bin/polyseat-profile unraid/seat-image/rootfs/usr/local/bin/polyseat-selftest
      - name: ShellCheck
        run: |
          for script in unraid/scripts/*.sh unraid/scripts/lib/*.sh unraid/tests/*.sh; do
            case "$script" in unraid/scripts/ci-canary-cgroup.sh|unraid/scripts/ci-e2e-canary.sh|unraid/scripts/ci-e2e-desktop-canary.sh|unraid/scripts/local-hook-rehearsal.sh|unraid/scripts/local-hook-rehearsal-inner.sh) continue ;; esac
            shellcheck -x -s sh "$script"
          done
          shellcheck -s bash unraid/scripts/ci-canary-cgroup.sh
          shellcheck -s bash unraid/scripts/ci-e2e-canary.sh
          shellcheck -s bash unraid/scripts/ci-e2e-desktop-canary.sh
          shellcheck -s bash unraid/scripts/local-hook-rehearsal.sh unraid/scripts/local-hook-rehearsal-inner.sh
          shellcheck -s bash unraid/plugin/src/emhttp/scripts/lxc-nvidia-hook
          shellcheck -x -s sh unraid/seat-image/build-seat-image.sh unraid/seat-image/provision.sh unraid/seat-image/rootfs/usr/local/bin/polyseat-sunshine-run
          shellcheck -s bash unraid/seat-image/rootfs/usr/local/bin/polyseat-profile unraid/seat-image/rootfs/usr/local/bin/polyseat-selftest
          shellcheck -s bash unraid/plugin/src/emhttp/scripts/polyseatctl unraid/plugin/src/emhttp/event/*
      - name: Bash syntax of plugin scripts
        run: |
          for script in unraid/plugin/src/emhttp/scripts/* unraid/plugin/src/emhttp/event/*; do
            bash -n "$script"
          done
      - name: JavaScript syntax
        run: node --check unraid/plugin/src/emhttp/js/psu.js
      - name: Disabled installer and CI-only build guardrails
        run: sh unraid/tests/safety-contract.sh
      - name: Tool versions used by the controller tests
        run: |
          jq --version; tar --version | head -n1; ssh-keygen -V 2>&1 | head -n1 || true
          flock --version | head -n1; python3 --version
          php --version | head -n1; node --version
          command -v php >/dev/null || { echo "php is required for the WebUI tests"; exit 1; }
      - name: Offline simulations, ABI/bundle checks and controller sandbox tests
        run: |
          python3 -W error::ResourceWarning -m compileall -q unraid/lab
          python3 -m unittest discover -s unraid/tests -p 'test_*.py' -v

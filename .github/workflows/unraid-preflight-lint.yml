name: Unraid WIP preflight checks
on:
  push:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
  pull_request:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n unraid/scripts/preflight.sh
      - name: Ensure preflight is read-only
        run: |
          ! grep -En '(^|[[:space:]])(curl|wget|apt|pacman|dnf|incus[[:space:]]+(init|launch)|systemctl[[:space:]]+(start|enable)|docker[[:space:]]+(run|stop)|rm[[:space:]]+-)' unraid/scripts/preflight.sh

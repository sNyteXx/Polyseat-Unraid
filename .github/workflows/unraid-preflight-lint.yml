name: Unraid WIP preflight checks

on:
  push:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
  pull_request:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: POSIX shell syntax
        run: |
          for script in unraid/scripts/*.sh unraid/tests/*.sh; do
            sh -n "$script"
          done
      - name: ShellCheck
        run: shellcheck -s sh unraid/scripts/*.sh unraid/tests/*.sh
      - name: Disabled installer and CI-only build guardrails
        run: sh unraid/tests/safety-contract.sh
      - name: Offline VM/GPU, lifecycle and hostile bundle simulations
        run: |
          python3 -m compileall -q unraid/lab
          python3 -m unittest discover -s unraid/tests -p 'test_*.py' -v

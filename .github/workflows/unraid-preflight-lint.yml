name: Unraid WIP preflight checks

on:
  push:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
  pull_request:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: POSIX shell syntax
        run: |
          for script in unraid/scripts/*.sh unraid/tests/*.sh; do
            sh -n "$script"
          done
      - name: ShellCheck
        run: shellcheck -s sh unraid/scripts/*.sh unraid/tests/*.sh
      - name: Disabled installer and CI-only build guardrails
        run: sh unraid/tests/safety-contract.sh

name: Unraid WIP preflight checks
on:
  push:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
  pull_request:
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid-preflight-lint.yml'
jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n unraid/scripts/preflight.sh
          sh -n unraid/scripts/check-host.sh
          sh -n unraid/scripts/verify-runtime.sh
      - name: ShellCheck
        run: shellcheck -s sh unraid/scripts/*.sh
      - name: Ensure no executable installer is shipped
        run: |
          test ! -f unraid/plugin/polyseat-unraid.plg
          test -f unraid/plugin/polyseat-unraid.plg.disabled
